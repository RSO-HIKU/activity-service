replicaCount: 1

environment: dev

image:
  repository: activity-service
  tag: dev-latest
  pullPolicy: Never

database:
  enabled: true
  host: postgres.database.svc.cluster.local
  port: "5432"
  name: hikudb
  schema: activity_service

azure:
  enabled: false

gitops:
  enabled: false

service:
  clusterIP:
    port: 8085
    address: "0.0.0.0"

  nodePort:
    enabled: true
    port: 8085
    nodePort: 30085

flyway:
  image:
    repository: activity-service-migrator
    tag: "dev"

jwtAuth:
  issuer: "http://localhost:8080/auth/realms/hiku-dev"
  jwksUri: "http://keycloak.keycloak.svc.cluster.local:8080/auth/realms/hiku-dev/protocol/openid-connect/certs"
